name: ZERO lives
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zero-session
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run one session
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          AGENT_ADDRESS: ${{ secrets.AGENT_ADDRESS }}
        run: node agent.mjs --rounds 25
      - name: Commit memory back
        run: |
          git config user.name "zero-agent"
          git config user.email "zero@broke2builtai.com"
          git add knowledge/ state/
          git diff --cached --quiet && echo "no memory changes" && exit 0
          git commit -m "ZERO session $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin main
          git push
